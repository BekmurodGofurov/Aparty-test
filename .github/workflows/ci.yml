name: CI / Auto Testing & PR Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 3. Frontend Client Build & Lint ────────────────────────────────────────
  frontend-checks:
    name: "Frontend Client (Vite Build & Lint)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm install

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint || true

      - name: Run unit tests
        working-directory: ./client
        run: npm test

      - name: Run Vite production build
        working-directory: ./client
        run: npm run build

  # ── 4. Microservices Python Syntax & Compile Check ────────────────────────
  microservices-check:
    name: "Microservices Syntax & Compile Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install microservice dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r microservices/services/iam-service/requirements.txt
          pip install -r microservices/services/catalog-service/requirements.txt
          pip install -r microservices/services/order-service/requirements.txt
          pip install -r microservices/services/notification-service/requirements.txt

      - name: Compile python files in microservices
        run: |
          python -m compileall microservices/

  # ── 4b. Microservice Tests (one PostgreSQL database per service) ──────────
  microservice-tests:
    name: "Tests: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            database: iam_test
          - service: catalog-service
            database: catalog_test
          - service: order-service
            database: orders_test
          - service: notification-service
            database: notifications_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: microservices/services/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: microservices/services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: microservices/services/${{ matrix.service }}
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/${{ matrix.database }}
        run: |
          pytest -v

  # ── 4c. Telegram bot tests ────────────────────────────────────────────────
  bot-tests:
    name: "Tests: telegram bot"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bot/requirements-dev.txt

      - name: Install dependencies
        working-directory: bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: bot
        run: pytest -v

  # ── 5. Docker Compose Configuration Validation ─────────────────────────────
  docker-compose-validation:
    name: "Docker Compose Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose --env-file .env.example config --quiet
