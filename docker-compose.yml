version: '3.8'

# All configuration comes from the root .env file (see .env.example).
# Required variables have no defaults: compose fails fast when one is missing.

x-shared-env: &shared_env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-aparty-iam}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-aparty-api}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}

services:

  # ── Redis (login state, refresh sessions, rate limits) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: aparty-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"   # host access for local debugging only
    networks:
      - aparty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (event broker) ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aparty-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # Management web UI
    networks:
      - aparty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (one database per service) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aparty-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_MULTIPLE_DATABASES: iam_db,catalog_db,orders_db,notifications_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aparty-network
    restart: unless-stopped

  # ── IAM Service ────────────────────────────────────────────────────────────
  iam-service:
    build:
      context: ./microservices/services/iam-service
      dockerfile: Dockerfile
    container_name: aparty-iam-service
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/iam_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      <<: *shared_env
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_REDIRECT_URI: ${TELEGRAM_REDIRECT_URI:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - aparty-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── Catalog Service (listings and image uploads) ───────────────────────────
  catalog-service:
    build:
      context: ./microservices/services/catalog-service
      dockerfile: Dockerfile
    container_name: aparty-catalog-service
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      <<: *shared_env
      IAM_SERVICE_URL: http://iam-service:8000
      IMGBB_API_KEY: ${IMGBB_API_KEY:-}
    networks:
      - aparty-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── Order Service (bookings) ───────────────────────────────────────────────
  order-service:
    build:
      context: ./microservices/services/order-service
      dockerfile: Dockerfile
    container_name: aparty-order-service
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orders_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      <<: *shared_env
      CATALOG_SERVICE_URL: http://catalog-service:8001
      IAM_SERVICE_URL: http://iam-service:8000
    networks:
      - aparty-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Notification Service (site bell and Telegram messages) ─────────────────
  notification-service:
    build:
      context: ./microservices/services/notification-service
      dockerfile: Dockerfile
    container_name: aparty-notification-service
    expose:
      - "8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notifications_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      <<: *shared_env
      IAM_SERVICE_URL: http://iam-service:8000
      BOT_TOKEN: ${BOT_TOKEN:-}
      SITE_URL: ${SITE_URL:-}
    networks:
      - aparty-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── API Gateway (Nginx) ────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: aparty-api-gateway
    ports:
      - "8080:80"            # all external traffic enters here
    networks:
      - aparty-network
    depends_on:
      - iam-service
      - catalog-service
      - order-service
      - notification-service
    restart: unless-stopped

networks:
  aparty-network:
    driver: bridge

volumes:
  postgres_data:
