version: '3.8'

services:

  # ── 1. Redis (OTP store) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aparty-redis
    ports:
      - "6379:6379"          # also exposed to host for local debugging
    networks:
      - aparty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. RabbitMQ (Message Broker for Microservices Pub/Sub) ─────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: aparty-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"        # Management Web UI
    networks:
      - aparty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Postgres (Local database) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aparty-postgres
    environment:
      POSTGRES_USER: aparty
      POSTGRES_PASSWORD: aparty_local_pass
      POSTGRES_MULTIPLE_DATABASES: iam_db,catalog_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aparty -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aparty-network
    restart: unless-stopped

  # ── 3. IAM Service (FastAPI) ───────────────────────────────────────────────
  iam-service:
    build:
      context: ./microservices/services/iam-service
      dockerfile: Dockerfile
    container_name: aparty-iam-service
    ports:
      - "8000:8000"
    env_file:
      - ./microservices/services/iam-service/.env
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-aparty-secret-key-2024-super-secure}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      OTP_TTL_SECONDS: 120
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,https://aparty.uz"
    networks:
      - aparty-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 4. Catalog Service (Listings, ImgBB Media, Bookings & Orders) ──────────
  catalog-service:
    build:
      context: ./microservices/services/catalog-service
      dockerfile: Dockerfile
    container_name: aparty-catalog-service
    ports:
      - "8001:8001"
    env_file:
      - ./microservices/services/catalog-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      IMGBB_API_KEY: ${IMGBB_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-aparty-secret-key-2024-super-secure}
      JWT_ALGORITHM: HS256
      SERVICE_NAME: catalog-service
    networks:
      - aparty-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # ── 5. API Gateway (Nginx) ─────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: aparty-api-gateway
    ports:
      - "8080:80"            # all external traffic enters here
    networks:
      - aparty-network
    depends_on:
      - iam-service
      - catalog-service
    restart: unless-stopped

networks:
  # Internal bridge network — all microservices communicate via service names
  aparty-network:
    driver: bridge

volumes:
  postgres_data:
