# ── Nginx API Gateway ─────────────────────────────────────────────────────────
# Reverse proxy routing external requests to backend microservices.

events {
    worker_connections 1024;
}

http {
    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream iam_backend {
        server iam-service:8000;
    }

    upstream catalog_backend {
        server catalog-service:8001;
    }

    map $host $proxy_host {
        default $host;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # ── Gateway health check ──────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ── IAM Service: authentication & user management ──────────────────────
        location /api/v1/auth/ {
            proxy_pass         http://iam_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
        }

        # ── Catalog Service: listings management ──────────────────────────────
        location /api/v1/listings {
            proxy_pass         http://catalog_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
        }

        # ── Catalog Service: ImgBB media uploads ──────────────────────────────
        location /api/v1/media/ {
            proxy_pass         http://catalog_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ── Catalog Service: bookings & orders ────────────────────────────────
        location /api/v1/bookings {
            proxy_pass         http://catalog_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
        }

        # ── Catch-all: reject unrouted paths ─────────────────────────────────
        location / {
            return 404 '{"detail":"Route not found on this gateway"}';
            add_header Content-Type application/json;
        }
    }
}
