# ── Nginx API Gateway ─────────────────────────────────────────────────────────
# Reverse proxy routing external requests to backend microservices.

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Per-IP request limits. Behind a load balancer, forward the client IP (real_ip) so these apply per client.
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # Docker internal DNS. Upstreams are resolved per request through variables,
    # so the gateway keeps running while a backend service is offline.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        limit_req zone=api burst=40 nodelay;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # ── IAM Service: authentication & user profiles ───────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $upstream http://iam-service:8000;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        location /api/v1/users/ {
            set $upstream http://iam-service:8000;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        # Internal service-to-service endpoint. Never exposed to clients.
        location /api/v1/users/public {
            default_type application/json;
            return 404 '{"detail":"Route not found on this gateway"}';
        }

        # ── Catalog Service: listings, saved listings and image uploads ───────
        location /api/v1/listings {
            set $upstream http://catalog-service:8001;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        location /api/v1/favorites {
            set $upstream http://catalog-service:8001;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        location /api/v1/media/ {
            set $upstream http://catalog-service:8001;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        # ── Order Service: bookings ───────────────────────────────────────────
        location /api/v1/bookings {
            set $upstream http://order-service:8002;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        # ── Notification Service: site bell ───────────────────────────────────
        location /api/v1/notifications {
            set $upstream http://notification-service:8003;
            proxy_pass $upstream;
            include /etc/nginx/proxy.conf;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Route not found on this gateway"}';
        }
    }
}
