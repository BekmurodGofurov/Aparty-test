# ── Nginx API Gateway ─────────────────────────────────────────────────────────
# Minimal configuration routing ONLY the paths that exist today.
# New service routes are added here as new microservices are built.

events {
    worker_connections 1024;
}

http {
    # ── Upstream: IAM Service ─────────────────────────────────────────────────
    # Docker Compose service name "iam-service" resolves to the container IP
    # automatically via Docker's internal DNS.
    upstream iam_backend {
        server iam-service:8000;
    }

    # ── Shared proxy settings ─────────────────────────────────────────────────
    # Applied to all proxy_pass blocks via an include-style approach.
    map $host $proxy_host {
        default $host;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        # ── Gateway health check ──────────────────────────────────────────────
        # Nginx responds directly — no upstream needed.
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ── IAM Service: all auth endpoints ──────────────────────────────────
        # Matches: /api/v1/auth/bot/register
        #          /api/v1/auth/bot/login-code
        #          /api/v1/auth/login
        #          /docs  /redoc  /openapi.json  (forwarded for Swagger UI)
        location /api/v1/auth/ {
            proxy_pass         http://iam_backend;
            proxy_http_version 1.1;

            # Preserve client information
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts suitable for local development
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
        }

        # ── IAM Swagger UI (local dev convenience) ────────────────────────────
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass         http://iam_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Catch-all: reject unrouted paths ─────────────────────────────────
        # Prevents accidental exposure of unbuilt services.
        location / {
            return 404 '{"detail":"Route not found on this gateway"}';
            add_header Content-Type application/json;
        }
    }
}
